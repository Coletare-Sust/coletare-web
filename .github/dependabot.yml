version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Recife
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      next-react:
        patterns: ["next", "next-*", "react", "react-dom", "@types/react*"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      patch-minor:
        update-types: ["patch", "minor"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Recife
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Recife
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]
