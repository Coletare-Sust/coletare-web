# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 1
  maxInstances: 100
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGIN_SENDER_ID
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL
    value: <preencher>
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: <preencher>
  - variable: NEXT_PUBLIC_LOGIN_URL
    value: <preencher>
  - variable: NEXT_PUBLIC_API_URL
    value: <preencher>
  - variable: NEXT_PUBLIC_NODEMAILER_USER
    value: <preencher>
  - variable: NEXT_PUBLIC_NODEMAILER_PASS
    value: <preencher>
  - variable: EXPO_ACCESS_TOKEN
    value: <preencher>
  - variable: NEXT_PUBLIC_FIREBASE_ADMIN_PRIVATE_KEY
    value: <preencher>
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
